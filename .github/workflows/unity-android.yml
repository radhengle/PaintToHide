name: Paint & Blend Unity validation and Android build

on:
  push:
    branches: [feature/game-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-editmode-tests:
    name: Unity EditMode tests
    if: ${{ vars.UNITY_ANDROID_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Unity EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: UnityProject
          unityVersion: 2022.3.50f1
          testMode: EditMode
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paint-blend-editmode-results
          path: artifacts/editmode
          if-no-files-found: warn

  android-apk:
    name: Build Android ARM64 APK
    if: ${{ vars.UNITY_ANDROID_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: unity-editmode-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Android APK with Unity 2022.3.50f1
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          PAINTBLEND_BUILD_PATH: ${{ github.workspace }}/Build/Android/PaintAndBlend.apk
        with:
          projectPath: UnityProject
          unityVersion: 2022.3.50f1
          targetPlatform: Android
          buildMethod: PaintBlend.Editor.PaintBlendBuildPipeline.BuildAndroid
          buildsPath: Build
          buildName: PaintAndBlend
          androidAppBundle: false
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: paint-blend-android-apk
          path: Build/Android/PaintAndBlend.apk
          if-no-files-found: error
