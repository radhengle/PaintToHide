name: Paint & Blend foundation validation

on:
  push:
    branches: [feature/game-foundation]
  pull_request:
    branches: [main]

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Unity package manifest, room catalogue and Blender script
        run: python tools/validate_foundation.py
